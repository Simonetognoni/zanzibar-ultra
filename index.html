<div id="bag" class="page">

  <div class="card">
    <h2>🧳 Checklist Valigia</h2>
    <small>La lista viene salvata automaticamente.</small>

    <div class="progress">
      <div class="bar" id="bar"></div>
    </div>

    <div id="percent" style="margin-top:8px">0% completato</div>
  </div>

  <div class="card">

    <label class="check"><input type="checkbox" data-id="1"> Passaporto</label>
    <label class="check"><input type="checkbox" data-id="2"> Patente</label>
    <label class="check"><input type="checkbox" data-id="3"> Voucher Hotel</label>
    <label class="check"><input type="checkbox" data-id="4"> Assicurazione</label>
    <label class="check"><input type="checkbox" data-id="5"> Costume</label>
    <label class="check"><input type="checkbox" data-id="6"> Maschera Snorkeling</label>
    <label class="check"><input type="checkbox" data-id="7"> Scarpette Reef</label>
    <label class="check"><input type="checkbox" data-id="8"> Crema SPF 50+</label>
    <label class="check"><input type="checkbox" data-id="9"> Powerbank</label>
    <label class="check"><input type="checkbox" data-id="10"> Adattatore UK</label>
    <label class="check"><input type="checkbox" data-id="11"> Farmaci</label>
    <label class="check"><input type="checkbox" data-id="12"> Contanti</label>

  </div>

</div>

<script>

/* ===== CONVERTITORE ===== */

const RATE = 2950;

const eur = document.getElementById("eur");
const tzs = document.getElementById("tzs");

if(eur && tzs){

  eur.oninput = ()=>{
    tzs.value = Math.round(eur.value * RATE);
  };

  tzs.oninput = ()=>{
    eur.value = (tzs.value / RATE).toFixed(2);
  };

  eur.oninput();

}

/* ===== CHECKLIST ===== */

const checks = document.querySelectorAll("[data-id]");

function updateChecks(){

  let done = 0;

  checks.forEach(c=>{

    const saved = localStorage.getItem("bag_"+c.dataset.id)==="1";

    c.checked = saved;

    if(saved) done++;

  });

  const pct = Math.round(done / checks.length * 100);

  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("percent").innerHTML = pct + "% completato";

}

checks.forEach(c=>{

  c.onchange = ()=>{

    localStorage.setItem(
      "bag_"+c.dataset.id,
      c.checked ? "1" : "0"
    );

    updateChecks();

  };

});

updateChecks();
/* =====================================================
   ZANZIBAR ULTRA PRO v3.0
===================================================== */

/* ---------- CAMBIO PAGINE ---------- */

let leafletMap = null;
let mapReady = false;

function show(id, btn){

  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".tabs button").forEach(b=>{
    b.classList.remove("active");
  });

  btn.classList.add("active");

  if(id==="maps"){
    setTimeout(initMap,150);
  }

}

/* ---------- COUNTDOWN ---------- */

const departure = new Date("2026-08-31T08:00:00");

function updateCountdown(){

  const now = new Date();
  const diff = departure-now;

  if(diff<=0){
    document.getElementById("countdown").innerHTML="✈️ SI PARTE!";
    return;
  }

  const days = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins = Math.floor((diff%3600000)/60000);

  document.getElementById("countdown").innerHTML =
    `${days} giorni ${hours}h ${mins}m`;

}

updateCountdown();
setInterval(updateCountdown,60000);

/* ---------- METEO LIVE ---------- */

async function updateWeather(){

  const lat=-6.24;
  const lon=39.53;

  try{

    const r = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,wind_speed_10m,precipitation`
    );

    const j = await r.json();

    document.getElementById("airTemp").innerHTML =
      j.current.temperature_2m+"°C";

    document.getElementById("windNow").innerHTML =
      Math.round(j.current.wind_speed_10m)+" km/h";

    document.getElementById("rainNow").innerHTML =
      (j.current.precipitation ?? 0)+"%";

  }catch(e){
    console.log(e);
  }

  try{

    const r = await fetch(
      `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=sea_surface_temperature`
    );

    const j = await r.json();

    document.getElementById("seaTemp").innerHTML =
      (j.current.sea_surface_temperature ?? 27)+"°C";

  }catch(e){
    console.log(e);
  }

}

updateWeather();

function renderGallery(){

  document.getElementById("galleryImg").src =

  document.getElementById("galleryTitle").innerHTML =

function changeHome(step){

  photoIndex =
    (photoIndex + step + gallery.length) % gallery.length;

  renderGallery();

}

/* ---------- LEAFLET 15 MARKER ---------- */

["🏨 ZAN Orient",-6.085,39.532],
["🍽️ The Rock",-6.149,39.533],
["🤿 Blue Lagoon",-6.134,39.557],
["⭐ Starfish Beach",-6.140,39.560],

["🏛️ Stone Town",-6.165,39.202],

["🌅 Michamvi Sunset",-6.120,39.490]

];

function initMap(){

  if(mapReady) return;

  mapReady=true;

  leafletMap = L.map("leafletMap").setView(
    [-6.17,39.35],
    10
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(leafletMap);

  markers.forEach(m=>{

    L.marker([m[1],m[2]])
      .addTo(leafletMap)
      .bindPopup(`<b>${m[0]}</b>`);

  });

}

/* ---------- BUDGET AUTOMATICO ---------- */

const budgetIds=[
"car",
"fuel",
"rock",
"tour",
"foodBudget",
"shop"
];

function calcBudget(){

  let total=0;

  budgetIds.forEach(id=>{

    const el=document.getElementById(id);

    if(!el) return;

    total += Number(el.value||0);

    localStorage.setItem("zb_"+id,el.value);

  });

  if(document.getElementById("tot"))
    document.getElementById("tot").innerHTML="€ "+total;

  if(document.getElementById("budgetBar")){

    const pct=Math.min(100,total/1500*100);

    document.getElementById("budgetBar").style.width=pct+"%";

  }

}

budgetIds.forEach(id=>{

  const el=document.getElementById(id);

  if(!el) return;

  const saved=localStorage.getItem("zb_"+id);

  if(saved) el.value=saved;

  el.addEventListener("input",calcBudget);

});

calcBudget();

/* ---------- CHECKLIST ---------- */

const checks=document.querySelectorAll("[data-id]");

function updateChecks(){

  let done=0;

  checks.forEach(c=>{

    const state=
      localStorage.getItem("bag_"+c.dataset.id)==="1";

    c.checked=state;

    if(state) done++;

  });

  const pct=Math.round(done/checks.length*100);

  document.getElementById("bar").style.width=pct+"%";

  document.getElementById("percent").innerHTML=
    pct+"% completato";

}

checks.forEach(c=>{

  c.addEventListener("change",()=>{

    localStorage.setItem(
      "bag_"+c.dataset.id,
      c.checked ? "1" : "0"
    );

    updateChecks();

  });

});

updateChecks();

</script>
